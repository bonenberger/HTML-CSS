<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>centralizando com flex box</title>
    <style>
        body {
            background-color: lightgrey;
        }
        main.container {
            width: 100vw;
            height: 100vh;
            background-color: blue;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        div {
            background-color: white;
            width: 200px;
            height: 200px;
            align-content: center;
            text-align: center;
        }
    </style>
</head>
<body>
    <main class="container">
        <section>
            <div>
                <h1>teste</h1>
            </div>
        </section>
    </main>
</body>
</html>
